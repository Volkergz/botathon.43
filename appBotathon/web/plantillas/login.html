{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta login">
  <h1>Iniciar sesión</h1>
  <p class="sutil">Planificación asistencial 2026</p>
  {% if error %}<p class="nota b" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Usuario<input name="usuario" autocomplete="username" required autofocus></label>
    <label>Contraseña<input type="password" name="contrasena" autocomplete="current-password" required></label>
    <button class="btn">Entrar</button>
  </form>
  {% if demo %}
  <p class="nota">Usuarios de prueba, con contraseña <code>demo1234</code>: <code>planificacion</code> y <code>arica</code>.</p>
  {% endif %}
</section>
{% endblock %}
